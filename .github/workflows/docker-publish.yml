name: Publish Docker image

# Unraid installs from a published image, so every release has to end up in a
# registry the template can point at. GHCR, because the repo is already on
# GitHub and the image carries `org.opencontainers.image.source` pointing here.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # The gate. Until this existed, `edge` shipped on every master commit and a
  # release image shipped on every tag with the test suite never having run —
  # the Dockerfile's two smoke checks were the only thing standing between a
  # broken commit and a published image.
  #
  # `workflow_call` into the same file the PRs use, so the release gate and the
  # PR gate cannot drift apart.
  #
  # It gates `merge`, not `build`. The build legs push digest-only images that
  # no tag points at, so building beside the checks publishes nothing a failed
  # check could leave behind — `edge` and the release tags are only ever applied
  # by `merge`. Running them in series made every publish wait check + build
  # back to back.
  check:
    uses: ./.github/workflows/ci.yml

  # amd64 and arm64 are built on their own native runners rather than one
  # runner under QEMU: better-sqlite3 compiles from source, and emulated
  # compilation of it takes tens of minutes. Each leg pushes a digest-only
  # image; the merge job below stitches them into one multi-arch tag.
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set platform pair
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      # The recommender model is a release asset, not a file in git — see
      # scripts/fetch-recs-model.mjs. `--require` fails the leg rather than
      # building an image without it.
      - name: Fetch recommender model
        run: node scripts/fetch-recs-model.mjs --require
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4
        with:
          # The runner is thrown away; tearing the builder down first only
          # added up to ~10s to every leg.
          cleanup: false

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            REQUIRE_RECS_MODEL=1
          # Digest-only push: the tag is applied once, by the merge job.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [check, build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      # No setup-buildx here: `imagetools` only talks to the registry, and the
      # runner's preinstalled buildx does that without booting a builder.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
