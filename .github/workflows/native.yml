name: Native apps

# The SwiftUI and Compose apps under native/. A workflow of its own rather than
# jobs in ci.yml: `docker-publish.yml` calls ci.yml as the gate on every image,
# and an iOS build failing — or a macOS runner queueing for ten minutes — has
# no business holding up a server release the apps don't ship in.
#
# Path-filtered to native/ alone. A schema change in
# `packages/contracts/src/native-api` reaches the apps only through the
# generated models committed under native/, and ci.yml's codegen `--check`
# fails until they are regenerated — so the regeneration commit is the one
# that runs this.
#
# What is not here: the UI tests (XCUITest, connectedAndroidTest). They drive a
# simulator or emulator against `pnpm native:dev-server`; run them locally (see
# DEVELOPMENT.md). Signing and store upload stay manual.
on:
  push:
    branches: [master]
    paths: ["native/**", ".github/workflows/native.yml"]
  pull_request:
    paths: ["native/**", ".github/workflows/native.yml"]
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # iOS 26 is the deployment target, which needs the Xcode 26 SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - run: xcodebuild -version

      # RubeKit's API, models and core build for macOS as well, so the
      # client, envelope and sign-in tests run without a simulator.
      - name: Package tests
        run: swift test --package-path native/ios/Packages/RubeKit

      - name: App builds
        run: >-
          xcodebuild build
          -project native/ios/Rube.xcodeproj
          -scheme Rube
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests, lint and a debug build
        run: ./gradlew test lint assembleDebug --console=plain
