name: CI

# Nothing ran the test suite. Not on a PR — there was no `pull_request`
# workflow at all — and not before publishing: `docker-publish.yml` pushed
# `edge` on every commit to master and the release image on every tag with the
# suite never having executed. The only automated check in the repo was
# `site-deploy.yml` running one package's tests to validate the rule registry.
#
# The consequence was already visible when this file was written: `pnpm lint`
# failed on master, because `scripts/check-nul.mjs` had caught raw NUL bytes
# that were reintroduced three commits after being fixed. Nothing ran the guard
# afterwards, so it came back.
#
# The pre-commit hook (oxlint, oxfmt, typecheck via lint-staged) stays useful
# but is not a gate: it only sees staged files, it skips tests entirely, and it
# is trivially bypassed with `--no-verify`.
on:
  pull_request:
  workflow_dispatch:
  # Called by `docker-publish.yml`, which runs on every master push and every
  # `v*` tag. That is where the master-branch gate lives: reused rather than
  # duplicated so the release gate cannot drift from the PR gate, and a call
  # rather than a cross-workflow `needs:` because a tag push would not trigger
  # this workflow on its own. Deliberately no `push:` trigger here — it would
  # mean every master commit ran the whole suite twice.
  workflow_call:

# A superseded PR push has nothing left to prove. A called run is not cancelled:
# `docker-publish.yml` gates on it, so cancelling would block the publish rather
# than skip it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Format, lint and typecheck in one job, the suite in four beside it. One job
  # running all of it took 2.5–4 minutes on a 2-vCPU hosted runner — the suite
  # alone was 100–170s there against ~45s on a 12-core laptop — and since
  # `docker-publish.yml` gates on this workflow, that was the floor under every
  # publish. Each job pays ~25s of checkout and install, which is why it is four
  # shards and not more.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the same pnpm as mise.toml / packageManager, for the reason
      # given in site-deploy.yml: a bare `pnpm` from elsewhere is how this repo
      # once ended up with a pnpm 8 lockfile.
      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          # This repo installs with `--frozen-lockfile` in its own step below;
          # the action's bare `pnpm install` default would pre-empt it.
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26.2.0
          cache: pnpm

      # `better-sqlite3` compiles a native addon and `sharp` resolves its
      # prebuilt libvips; both are named in pnpm-workspace.yaml's `allowBuilds`,
      # without which pnpm 11 fails the install outright.
      - run: pnpm install --frozen-lockfile

      # Ordered cheapest-first so a formatting slip doesn't cost a typecheck to
      # discover, and each step is `if: always()` so one failure reports every
      # other problem in the same run rather than one per push.
      - name: Format
        if: always()
        run: pnpm format:check

      - name: Lint
        if: always()
        run: pnpm lint

      - name: Typecheck
        if: always()
        run: pnpm typecheck

      - name: Native models are current
        if: always()
        run: pnpm native:codegen --check

  test:
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports, so one push shows every failing test.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          version: 11.21.0
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26.2.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Node's own sharding: it deals the file list round-robin, so git's
      # package-grouped order (see scripts/test.mjs) still spreads the heavy
      # DB/HTTP files across shards rather than stacking them in one.
      - name: Test
        run: pnpm test --test-shard=${{ matrix.shard }}/4
