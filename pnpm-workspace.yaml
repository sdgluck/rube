packages:
  - "apps/*"
  - "packages/*"
  - "clients/*"
  - "domains/*"

# pnpm 10 stopped running dependency build scripts unless they are named here,
# and pnpm 11 fails the install outright (ERR_PNPM_IGNORED_BUILDS) rather than
# warning. These three are the ones this repo genuinely needs to build:
# better-sqlite3 compiles a native addon, sharp resolves its prebuilt libvips,
# and esbuild places its platform binary for Vite. Everything else stays
# blocked, which is the point of the allowlist.
#
# Three things here fail quietly rather than loudly, so don't "tidy" them:
# the setting used to live under a "pnpm" key in package.json, which pnpm 11
# no longer reads; it used to be called `onlyBuiltDependencies`; and it takes a
# map of name -> true, not a list. A list parses fine and is then ignored, and
# `pnpm config list` echoes the old spelling back either way, so a wrong shape
# looks correct right up until the install refuses to build anything. This is
# the shape `pnpm approve-builds` writes for itself.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true

# drizzle-kit still loads config through the deprecated @esbuild-kit loader,
# which pins esbuild ~0.18 — inside the range of GHSA-67mh-4wv8-2f99 (any page
# can drive the dev server). Lift just that edge onto the 0.25 line drizzle-kit
# already uses itself; a bare `esbuild` override would also move vite's copy
# onto a major it hasn't been released against. Drop this once drizzle-kit
# stops depending on @esbuild-kit.
#
# tsx's `~0.28.0` already admits the fixed 0.28.1 (GHSA-g7r4-m6w7-qqqr, a
# Windows dev server file read), but pnpm keeps the locked 0.28.0 through every
# `update`, so the floor is stated here instead. Drop it once tsx requires
# >=0.28.1.
overrides:
  "@esbuild-kit/core-utils>esbuild": ^0.25.12
  "tsx>esbuild": ~0.28.1
