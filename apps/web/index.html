<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve to
         anything but 0; the bottom nav and content padding both depend on it.
         interactive-widget=resizes-content makes the on-screen keyboard shrink
         the layout viewport, so a pinned footer rises above it rather than
         being covered. maximum-scale=1 stops iOS zooming into a field on
         focus — whatever its font size — which is a web page's behaviour, not
         an app's; iOS Safari still lets people pinch-zoom for accessibility. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f1615" />
    <!-- The stylesheet reads `data-theme` off <html> and has no
         prefers-color-scheme block of its own, so the attribute has to exist
         before the first paint or the page draws light and flips. Inline and
         synchronous for that reason: a module import resolves after layout.
         The key is mirrored from src/theme.ts — keep the two spellings equal. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("tb.theme") || "system";
          var dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
        // Interface size (src/ui-scale.ts). Unvalidated beyond being a sane
        // number: ui-scale.ts re-applies a checked value once the bundle loads.
        try {
          var scale = Number(localStorage.getItem("tb.scale"));
          if (scale >= 0.5 && scale <= 2) document.documentElement.style.setProperty("--ui-scale", String(scale));
        } catch (e) {}
        // Platform conventions (see packages/native-client/src/platform.ts,
        // which this mirrors). Before first paint, so the phone layout never
        // draws in the wrong platform's style and then flips.
        try {
          var p = new URLSearchParams(location.search).get("platform");
          if (p !== "ios" && p !== "android" && p !== "desktop") {
            var ua = navigator.userAgent;
            p = /android/i.test(ua)
              ? "android"
              : /iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1)
                ? "ios"
                : "desktop";
          }
          document.documentElement.dataset.platform = p;
        } catch (e) {
          document.documentElement.dataset.platform = "desktop";
        }
      })();
    </script>
    <!-- Archivo for interface text, IBM Plex Mono for anything the machine
         produced. Both are self-hosted from /fonts — see src/styles/fonts.css.
         Preloading the two latin faces the first paint needs keeps the swap
         from landing after the page has already drawn. -->
    <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="description" content="Tinkerbell — self-hosted Plex library automation." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tinkerbell" />
    <title>Tinkerbell</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
